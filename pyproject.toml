[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kami"
version = "0.1.0"
description = "Hotkey-summoned AI sidekick for the Linux desktop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
hotkey = ["pynput>=1.7"]   # global hotkey on X11
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kami = "kami.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]   # Claude Code helper scripts, not Kami

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
