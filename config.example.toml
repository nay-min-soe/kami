# Copy to ~/.config/kami/config.toml and edit.

[llm]
# Text, starting with http:// or https://. Any OpenAI-compatible endpoint works.
# OpenRouter is the default.
base_url = "https://openrouter.ai/api/v1"
# Text. "openrouter/auto" lets OpenRouter pick. For "Explain screen" choose a
# vision-capable model from https://openrouter.ai/models
model = "openrouter/auto"
# Text. Prefer the KAMI_API_KEY or OPENROUTER_API_KEY environment variable.
# A key set here is used only if neither variable is set.
api_key = ""

[hotkey]
# Text. Used by the built-in listener (X11 + the optional pynput extra).
# On Wayland, bind your desktop shortcut to the command:  kami toggle
toggle = "<ctrl>+<alt>+k"

[app_control]
# A list of app names in quotes, e.g. ["firefox"]. Kami may only act inside these
# apps (executable names, lowercase).
allowed_apps = ["firefox", "code"]
